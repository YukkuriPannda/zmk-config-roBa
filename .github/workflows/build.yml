on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - boards/**
      - build.yaml
      # 独自 Zephyr モジュール(src/battery_led.c など)。
      # ここを漏らすと C コードだけを直した push がビルドされず、
      # 検証したつもりで未検証のまま進んでしまう。
      - src/**
      - CMakeLists.txt
      - Kconfig
      - zephyr/**
      # ビルド定義自体の変更でも走らせる
      - .github/workflows/build.yml

jobs:
  build:
    # Zephyr 4.1 の修飾付きボード名 (xiao_ble//zmk) を成果物名へ安全に変換する版。
    # main 追従ではなく、検証対象を再現できるようコミット SHA で固定する。
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@641514a97db345f499dd50b0360e594270f008fe
